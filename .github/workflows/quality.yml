name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://umgryjsxpvycrrcjtglm.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0rsbKWDBShD_-CMwTVadTw_tJy9bWNp
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Prepare audited Connexio web icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/connexio-web-icon.base64 > assets/connexio-web-icon.png
          test -s assets/connexio-web-icon.png
          file assets/connexio-web-icon.png | grep -q 'PNG image data'
          ACTUAL_SHA256=$(sha256sum assets/connexio-web-icon.png | awk '{print $1}')
          EXPECTED_SHA256=d6e61ed647f1da897ce0c24f0db46c3ce61babe6d8ad2aae16d136aa7ff305a3
          echo "Web icon SHA256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Ícone web inválido."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const webIcon = './assets/connexio-web-icon.png';
          app.expo.icon = webIcon;
          app.expo.ios = { ...(app.expo.ios || {}), icon: webIcon };
          app.expo.android = {
            ...(app.expo.android || {}),
            icon: webIcon,
            adaptiveIcon: {
              ...(app.expo.android?.adaptiveIcon || {}),
              foregroundImage: webIcon,
              monochromeImage: webIcon
            }
          };
          app.expo.web = { ...(app.expo.web || {}), favicon: webIcon };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck --silent > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: ESLint
        run: npm run lint --silent

      - name: Export web
        shell: bash
        run: |
          set +e
          npx expo export --platform web > web-export.log 2>&1
          status=$?
          cat web-export.log
          exit $status

      - name: Upload web export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-export-diagnostics
          path: web-export.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload web preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connexio-web
          path: dist
          retention-days: 3
