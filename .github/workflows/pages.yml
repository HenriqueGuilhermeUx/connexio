name: Publish Connexio Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/supabase-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Load public Expo variables
        run: cp .env.example .env

      - name: Prepare audited Connexio web icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/connexio-web-icon.base64 > assets/connexio-web-icon.png
          test -s assets/connexio-web-icon.png
          file assets/connexio-web-icon.png | grep -q 'PNG image data'
          ACTUAL_SHA256=$(sha256sum assets/connexio-web-icon.png | awk '{print $1}')
          EXPECTED_SHA256=d6e61ed647f1da897ce0c24f0db46c3ce61babe6d8ad2aae16d136aa7ff305a3
          echo "Web icon SHA256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Ícone web inválido."
            exit 1
          fi

      - name: Configure GitHub Pages web export
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const webIcon = './assets/connexio-web-icon.png';
          app.expo.icon = webIcon;
          app.expo.ios = { ...(app.expo.ios || {}), icon: webIcon };
          app.expo.android = {
            ...(app.expo.android || {}),
            icon: webIcon,
            adaptiveIcon: {
              ...(app.expo.android?.adaptiveIcon || {}),
              foregroundImage: webIcon,
              monochromeImage: webIcon
            }
          };
          app.expo.web = { ...(app.expo.web || {}), favicon: webIcon };
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/connexio'
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Export web
        run: npx expo export --platform web

      - name: Prepare Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
