name: Build Connexio Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Arquivo Android
        required: true
        default: apk
        type: choice
        options:
          - apk
          - play-store

permissions:
  contents: read

jobs:
  build:
    name: Gerar Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_ANDROID_PACKAGE: br.com.alternativeventures.connexio
      TARGET_UPLOAD_SHA1: D5:AC:0F:BB:64:8B:69:99:87:6F:27:4E:01:06:98:3D:B9:C1:F4:74
      EXPECTED_LAUNCHER_SHA256: 2dead15b728e96074c7050b6c77932c0730a94d12f5db8a14ea0e61b087d8e24

    steps:
      - name: Verificar token Expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Crie o secret EXPO_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Baixar código do Connexio
        uses: actions/checkout@v5
        with:
          ref: agent/supabase-foundation

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar ícones oficiais do Connexio
        shell: bash
        run: |
          base64 --decode assets/connexio-app-icon.base64 > assets/connexio-app-icon.png
          base64 --decode assets/connexio-adaptive-foreground.base64 > assets/connexio-adaptive-foreground.png

          file assets/connexio-app-icon.png
          file assets/connexio-adaptive-foreground.png

          test -s assets/connexio-app-icon.png
          test -s assets/connexio-adaptive-foreground.png
          echo "Ícones oficiais do Connexio preparados."

      - name: Validar configuração visual e pacote
        shell: bash
        run: |
          RESOLVED_PACKAGE=$(node -e "const app=require('./app.json'); process.stdout.write(app.expo?.android?.package || '')")
          RESOLVED_ICON=$(node -e "const app=require('./app.json'); process.stdout.write(app.expo?.android?.icon || app.expo?.icon || '')")
          RESOLVED_ADAPTIVE_ICON=$(node -e "const app=require('./app.json'); process.stdout.write(app.expo?.android?.adaptiveIcon?.foregroundImage || '')")

          echo "Pacote configurado: $RESOLVED_PACKAGE"
          echo "Ícone configurado: $RESOLVED_ICON"
          echo "Ícone adaptativo configurado: $RESOLVED_ADAPTIVE_ICON"

          if [ "$RESOLVED_PACKAGE" != "$EXPECTED_ANDROID_PACKAGE" ]; then
            echo "Pacote incorreto. Esperado: $EXPECTED_ANDROID_PACKAGE"
            exit 1
          fi

          if [ "$RESOLVED_ICON" != "./assets/connexio-app-icon.png" ]; then
            echo "Ícone principal incorreto."
            exit 1
          fi

          if [ "$RESOLVED_ADAPTIVE_ICON" != "./assets/connexio-adaptive-foreground.png" ]; then
            echo "Ícone adaptativo incorreto."
            exit 1
          fi

      - name: Recriar projeto Android limpo
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Validar pacote e ícones no projeto Android
        shell: bash
        run: |
          echo "Conferindo applicationId nativo..."
          if ! grep -Eq "applicationId[[:space:]]+['\"]${EXPECTED_ANDROID_PACKAGE}['\"]" android/app/build.gradle; then
            echo "O projeto Android não contém o applicationId esperado."
            grep -n "applicationId" android/app/build.gradle || true
            exit 1
          fi

          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.webp
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.webp
          echo "applicationId e ícones nativos confirmados."

      - name: Definir tipo de arquivo
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "play-store" ]; then
            echo "EAS_PROFILE=production" >> "$GITHUB_ENV"
            echo "OUTPUT_FILE=connexio-play-store-${{ github.run_number }}.aab" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=connexio-play-store-${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "EAS_PROFILE=preview" >> "$GITHUB_ENV"
            echo "OUTPUT_FILE=connexio-teste-${{ github.run_number }}.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=connexio-apk-teste-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Gerar arquivo Android
        run: eas build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output "./$OUTPUT_FILE"

      - name: Auditar artefato final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output

          if [ "${{ inputs.build_type }}" = "play-store" ]; then
            SIGNER_SHA1=$(keytool -printcert -jarfile "$OUTPUT_FILE" | awk -F'SHA1: ' '/SHA1:/ {print $2; exit}' | xargs)
            echo "Assinatura encontrada: $SIGNER_SHA1"
            echo "Assinatura esperada:  $TARGET_UPLOAD_SHA1"

            if [ "$SIGNER_SHA1" != "$TARGET_UPLOAD_SHA1" ]; then
              echo "BLOQUEADO: o AAB foi assinado com uma chave diferente da chave de upload alvo."
              exit 1
            fi

            LAUNCHER_PATH="base/res/mipmap-xxxhdpi-v4/ic_launcher.webp"
            unzip -p "$OUTPUT_FILE" "$LAUNCHER_PATH" > release-output/ic_launcher_from_aab.webp
            test -s release-output/ic_launcher_from_aab.webp

            LAUNCHER_SHA256=$(sha256sum release-output/ic_launcher_from_aab.webp | awk '{print $1}')
            echo "Launcher SHA256 encontrado: $LAUNCHER_SHA256"
            echo "Launcher SHA256 esperado:  $EXPECTED_LAUNCHER_SHA256"

            if [ "$LAUNCHER_SHA256" != "$EXPECTED_LAUNCHER_SHA256" ]; then
              echo "BLOQUEADO: o ícone empacotado no AAB não é idêntico ao launcher já auditado e aprovado."
              exit 1
            fi

            AAB_SHA256=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
            cat > release-output/release-audit.txt <<EOF
Connexio Android release gate
Package: $EXPECTED_ANDROID_PACKAGE
AAB: $OUTPUT_FILE
AAB SHA256: $AAB_SHA256
Upload certificate SHA1: $SIGNER_SHA1
Target upload SHA1: $TARGET_UPLOAD_SHA1
Launcher resource: $LAUNCHER_PATH
Launcher SHA256: $LAUNCHER_SHA256
Expected launcher SHA256: $EXPECTED_LAUNCHER_SHA256
Result: PASS
EOF
          fi

      - name: Preparar arquivos da versão
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp "$OUTPUT_FILE" release-output/

          if [ "${{ inputs.build_type }}" = "play-store" ]; then
            keytool -printcert -rfc -jarfile "$OUTPUT_FILE" \
              | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
              > release-output/upload_certificate.pem
            keytool -printcert -jarfile "$OUTPUT_FILE" > release-output/upload_certificate_info.txt
            test -s release-output/upload_certificate.pem
          fi

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-output
          if-no-files-found: error
          retention-days: 14
