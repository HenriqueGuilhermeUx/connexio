name: Build Connexio Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Arquivo Android
        required: true
        default: apk
        type: choice
        options:
          - apk
          - play-store

permissions:
  contents: read

jobs:
  build:
    name: Gerar Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_ANDROID_PACKAGE: br.com.alternativeventures.connexio
      EXPECTED_APP_VERSION: 0.4.0
      MIN_VERSION_CODE: 6
      TARGET_UPLOAD_SHA1: F7:6A:76:7A:3B:2E:C2:B1:B8:6E:C0:FE:0F:4C:66:0A:21:10:BC:A0
      EXPECTED_LAUNCHER_SHA256: 2dead15b728e96074c7050b6c77932c0730a94d12f5db8a14ea0e61b087d8e24

    steps:
      - name: Verificar token Expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Crie o secret EXPO_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Baixar exatamente o código selecionado no workflow
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar assets oficiais
        run: npm run assets

      - name: Validar identidade da release
        run: npm run validate:release

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Preparar assinatura local da Play Store
        if: ${{ inputs.build_type == 'play-store' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CONNEXIO_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CONNEXIO_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CONNEXIO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CONNEXIO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "BLOQUEADO: secrets da chave de upload não estão completos."
            exit 1
          fi
          mkdir -p .ci-signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .ci-signing/connexio-upload.jks
          chmod 600 .ci-signing/connexio-upload.jks
          KEYSTORE_SHA1=$(keytool -list -v -keystore .ci-signing/connexio-upload.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F'SHA1: ' '/SHA1:/ {print $2; exit}' | xargs)
          echo "SHA1 da JKS: $KEYSTORE_SHA1"
          if [ "$KEYSTORE_SHA1" != "$TARGET_UPLOAD_SHA1" ]; then
            echo "BLOQUEADO: JKS não corresponde à chave autorizada."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('credentials.json', JSON.stringify({ android: { keystore: {
            keystorePath: '.ci-signing/connexio-upload.jks',
            keystorePassword: process.env.KEYSTORE_PASSWORD,
            keyAlias: process.env.KEY_ALIAS,
            keyPassword: process.env.KEY_PASSWORD
          }}}, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Recriar projeto Android limpo
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Validar applicationId e versão nativa
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+['\"]${EXPECTED_ANDROID_PACKAGE}['\"]" android/app/build.gradle
          VERSION_NAME=$(grep -E "versionName[[:space:]]+['\"]" android/app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          echo "Version name nativa: $VERSION_NAME"
          if [ "$VERSION_NAME" != "$EXPECTED_APP_VERSION" ]; then
            echo "BLOQUEADO: versionName divergente."
            exit 1
          fi
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.webp

      - name: Definir tipo de arquivo
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "play-store" ]; then
            echo "EAS_PROFILE=play-store" >> "$GITHUB_ENV"
            echo "OUTPUT_FILE=connexio-play-store-${{ github.run_number }}.aab" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=connexio-play-store-${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "EAS_PROFILE=preview" >> "$GITHUB_ENV"
            echo "OUTPUT_FILE=connexio-teste-${{ github.run_number }}.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=connexio-apk-teste-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Gerar arquivo Android no runner do GitHub
        run: eas build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output "./$OUTPUT_FILE"

      - name: Auditar artefato final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          if [ "${{ inputs.build_type }}" = "play-store" ]; then
            SIGNER_SHA1=$(keytool -printcert -jarfile "$OUTPUT_FILE" | awk -F'SHA1: ' '/SHA1:/ {print $2; exit}' | xargs)
            if [ "$SIGNER_SHA1" != "$TARGET_UPLOAD_SHA1" ]; then
              echo "BLOQUEADO: assinatura do AAB incorreta."
              exit 1
            fi
            LAUNCHER_PATH="base/res/mipmap-xxxhdpi-v4/ic_launcher.webp"
            unzip -p "$OUTPUT_FILE" "$LAUNCHER_PATH" > release-output/ic_launcher_from_aab.webp
            LAUNCHER_SHA256=$(sha256sum release-output/ic_launcher_from_aab.webp | awk '{print $1}')
            if [ "$LAUNCHER_SHA256" != "$EXPECTED_LAUNCHER_SHA256" ]; then
              echo "BLOQUEADO: launcher empacotado difere do Connexio aprovado."
              exit 1
            fi
            AAB_SHA256=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
            printf '%s\n' \
              "Connexio Android release gate" \
              "Source ref: $GITHUB_REF_NAME" \
              "Source SHA: $GITHUB_SHA" \
              "Version: $EXPECTED_APP_VERSION" \
              "Expected minimum versionCode: $MIN_VERSION_CODE" \
              "Package: $EXPECTED_ANDROID_PACKAGE" \
              "AAB: $OUTPUT_FILE" \
              "AAB SHA256: $AAB_SHA256" \
              "Upload certificate SHA1: $SIGNER_SHA1" \
              "Launcher SHA256: $LAUNCHER_SHA256" \
              "Result: PASS" > release-output/release-audit.txt
          fi
          cp "$OUTPUT_FILE" release-output/

      - name: Extrair certificado da versão Play
        if: ${{ inputs.build_type == 'play-store' }}
        shell: bash
        run: |
          keytool -printcert -rfc -jarfile "$OUTPUT_FILE" | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > release-output/upload_certificate.pem
          keytool -printcert -jarfile "$OUTPUT_FILE" > release-output/upload_certificate_info.txt

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-output
          if-no-files-found: error
          retention-days: 14

      - name: Remover credenciais temporárias
        if: always()
        run: rm -rf .ci-signing credentials.json
