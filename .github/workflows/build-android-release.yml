name: Build Connexio Android APK + AAB

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-release.yml'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
  push:
    branches:
      - agent/connexio-gestor-foundation
    paths:
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
      EAS_LOCAL_BUILD_WORKINGDIR: /tmp/eas-local-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize Expo token
        shell: bash
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_EXPO_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
          echo "::add-mask::$CLEAN_TOKEN"
          echo "EXPO_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release
        run: |
          npm run assets
          npm run validate:release
          npm run typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo account
        run: eas whoami

      - name: Build APK preview locally
        run: |
          rm -rf /tmp/eas-local-build
          eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/Connexio-0.4.2-preview.apk"
          test -s Connexio-0.4.2-preview.apk

      - name: Smoke test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r Connexio-0.4.2-preview.apk
            adb shell monkey -p br.com.alternativeventures.connexio -c android.intent.category.LAUNCHER 1
            sleep 12
            PID=$(adb shell pidof br.com.alternativeventures.connexio | tr -d '\r')
            echo "Connexio PID=$PID"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            if [ -z "$PID" ]; then
              echo "Connexio died during startup. Relevant logcat:"
              adb logcat -d | grep -E -i 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|SoLoader|connexio|Expo|Hermes' | tail -n 300
              exit 1
            fi
            if adb logcat -d | grep -E -i 'FATAL EXCEPTION.*br.com.alternativeventures.connexio|Process: br.com.alternativeventures.connexio.*FATAL' >/dev/null; then
              echo "Fatal exception detected after launch:"
              adb logcat -d | grep -E -i 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|SoLoader|connexio|Expo|Hermes' | tail -n 300
              exit 1
            fi
            echo "ANDROID STARTUP SMOKE TEST: PASS"

      - name: Build production AAB locally
        run: |
          rm -rf /tmp/eas-local-build
          eas build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/Connexio-0.4.2-production.aab"
          test -s Connexio-0.4.2-production.aab

      - name: Record checksums
        run: |
          sha256sum Connexio-0.4.2-preview.apk Connexio-0.4.2-production.aab > android-checksums.txt
          ls -lh Connexio-0.4.2-preview.apk Connexio-0.4.2-production.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-APK-0.4.2-tested
          path: Connexio-0.4.2-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-AAB-0.4.2-tested
          path: Connexio-0.4.2-production.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-Android-Checksums-0.4.2-tested
          path: android-checksums.txt
          if-no-files-found: error
          retention-days: 30
