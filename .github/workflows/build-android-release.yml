name: Build Connexio Android APK + AAB

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-release.yml'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
  push:
    branches:
      - agent/connexio-gestor-foundation
    paths:
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
      EAS_LOCAL_BUILD_WORKINGDIR: /tmp/eas-local-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize Expo token
        shell: bash
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_EXPO_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
          echo "::add-mask::$CLEAN_TOKEN"
          echo "EXPO_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release
        run: |
          npm run assets
          npm run validate:release
          npm run typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo account
        run: eas whoami

      - name: Build APK preview locally
        run: |
          rm -rf /tmp/eas-local-build
          eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/Connexio-0.4.1-preview.apk"
          test -s Connexio-0.4.1-preview.apk

      - name: Build production AAB locally
        run: |
          rm -rf /tmp/eas-local-build
          eas build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/Connexio-0.4.1-production.aab"
          test -s Connexio-0.4.1-production.aab

      - name: Record checksums
        run: |
          sha256sum Connexio-0.4.1-preview.apk Connexio-0.4.1-production.aab > android-checksums.txt
          ls -lh Connexio-0.4.1-preview.apk Connexio-0.4.1-production.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-APK-0.4.1
          path: Connexio-0.4.1-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-AAB-0.4.1
          path: Connexio-0.4.1-production.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Connexio-Android-Checksums-0.4.1
          path: android-checksums.txt
          if-no-files-found: error
          retention-days: 30
