name: Connexio native iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'app.json'
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/ios-native-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connexio-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project without signing
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build unsigned iOS simulator application
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -list -workspace "$WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/connexio-derived" build 2>&1 | tee ios-native-build.log
      - name: Install and launch on iPhone simulator
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/connexio-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{const ds=Object.values(JSON.parse(x).devices).flat();const d=ds.find(x=>x.isAvailable&&x.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "br.com.connexio.app"
          echo "Testing verified $BUNDLE_ID on $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/connexio-ios-launch.png"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Confirm declared iPad family in unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/connexio-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -d "$APP_PATH"
          DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist")"
          echo "$DEVICE_FAMILY" | grep -Eq '(^|[^0-9])2([^0-9]|$)'
          echo "PASS: Connexio iPad device family in compiled binary"
      - name: Install and launch on iPad simulator
        shell: bash
        timeout-minutes: 22
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/connexio-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "br.com.connexio.app"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{const ds=Object.values(JSON.parse(x).devices).flat();const d=ds.find(x=>x.isAvailable&&x.name.startsWith("iPad"));if(!d)process.exit(1);console.log(d.udid)})')"
          export DEVICE_ID BUNDLE_ID
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/connexio-ipad-launch.png"
          # The screenshot and launch are the required smoke evidence.
          # Hosted macOS may stall on cleanup even after launch/screenshot succeed.
          # Run bounded cleanup without concealing failures above.
          python3 - <<'PY'
          import os, subprocess
          device = os.environ["DEVICE_ID"]
          bundle = os.environ["BUNDLE_ID"]
          for label, args in (
              ("terminate", ["xcrun", "simctl", "terminate", device, bundle]),
              ("shutdown", ["xcrun", "simctl", "shutdown", device]),
          ):
              try:
                  result = subprocess.run(args, timeout=20, capture_output=True, text=True)
                  if result.returncode:
                      print(f"CLEANUP_WARNING {label}: {(result.stdout + result.stderr)[-500:]}", flush=True)
              except subprocess.TimeoutExpired:
                  print(f"CLEANUP_TIMEOUT {label}: bounded after 20s; launch and screenshot already recorded", flush=True)
          PY
          echo "PASS: iPad launch with screenshot; functional QA remains separate"
      - name: Upload iPad simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connexio-ipad-launch-screenshot
          path: ${{ runner.temp }}/connexio-ipad-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload simulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connexio-ios-launch-screenshot
          path: ${{ runner.temp }}/connexio-ios-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connexio-native-ios-log
          path: ios-native-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connexio-ios-simulator-app
          path: ${{ runner.temp }}/connexio-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
